#cloud-config
# The launch credential also owns the guest account and Calm Python environment.
timezone: @@{TIMEZONE}@@
users:
  - name: "@@{NUTANIX.username}@@"
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: @@{NUTANIX.secret}@@
chpasswd: { expire: false }
ssh_pwauth: true
package_update: true
packages:
  - python3-venv
  - python3-pip
runcmd:
  # PC 7.5 exposes Networking/Prism v4.3 and VMM v4.2; latest SDKs target newer APIs.
  - sudo -iu '@@{NUTANIX.username}@@' bash -c 'mkdir -p ~/.calm && python3 -m venv ~/.calm/venv && ~/.calm/venv/bin/pip install --quiet --upgrade pip && ~/.calm/venv/bin/pip install --quiet ntnx-networking-py-client==4.3.1 ntnx-vmm-py-client==4.2.2 ntnx-prism-py-client==4.3.1 jsonpath-ng requests'
