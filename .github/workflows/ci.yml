name: ci

# Run the test suite + typecheck on every push to main / develop and on
# every PR targeting either. Catches regressions across all 4 workspace
# packages without needing an HPoC — everything below runs against the
# mock adapter. `develop` is the active integration branch; `main`
# stays clean for vetted merges only.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same ref when a newer commit lands —
# saves CI minutes during rapid iteration on a feature branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default token is read-only; the test-report publisher needs to write a
# check run + a PR comment with the results.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to the same minor as the runtime/Dockerfile (1.3) so CI
          # exercises the same Bun the operator deploys.
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (4 packages)
        run: bun run typecheck

      - name: Run tests (all packages)
        # `bun test` from the repo root walks workspaces and runs every
        # *.test.ts. Aggregates 217+ tests across engine / server /
        # nutanix / frontend (incl. `e2e-mock-autoplay.test.ts` which
        # walks the full pack against fixture-backed checks — catches
        # regressions in act / check / fixture wiring).
        # --reporter=junit writes a JUnit XML alongside the normal console
        # output so the publish step can surface results in the PR.
        run: bun test --reporter=junit --reporter-outfile=./junit-bun.xml

      - name: Set up Python 3.9 (calm-dsl needs 3.9)
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install pytest + ntnx-ncm-dsl
        run: |
          pip install pytest ntnx-ncm-dsl==4.3.1 --quiet

      - name: Patch calm-dsl unreachable-PC bug
        # Same in-place patch the release.yml workflow applies — without
        # it `calm init dsl` errors on `is_ncm_enabled(client)` when
        # there's no PC reachable. Bug in calm-dsl 4.3.1 upstream.
        run: |
          python3 - <<'PY'
          import calm.dsl.api.util as m, pathlib
          p = pathlib.Path(m.__file__)
          src = p.read_text()
          new = src.replace(
              'result = json.loads(res.content)',
              'result = json.loads(res.content) if res is not None else {}',
          )
          assert new != src, 'patch did not match — calm-dsl source moved'
          p.write_text(new)
          print('patched', p)
          PY

      - name: Bootstrap calm-dsl config + dsl.db cache
        # Mirrors release.yml: write config files directly + bootstrap
        # the schema via seed_ci_cache.py (which imports calm.dsl.db
        # to trigger peewee's create_tables). No PC contact required.
        run: |
          mkdir -p ~/.calm/.local
          cat > ~/.calm/config.ini <<'EOF'
          [SERVER]
          pc_ip = 127.0.0.1
          pc_port = 9440
          pc_username = admin
          pc_password = stub
          api_key_location = -

          [NCM_SERVER]
          ncm_enabled = False
          host = None
          port = None

          [NC_SERVER]
          enabled = False
          host = None
          username = admin
          password = stub

          [PROJECT]
          name = production

          [LOG]
          level = INFO

          [POLICY]
          policy_status = False

          [APPROVAL_POLICY]
          approval_policy_status = True

          [STRATOS]
          stratos_status = False

          [CLOUD_PROVIDERS]
          cp_status = True

          [CONNECTION]
          retries_enabled = True
          connection_timeout = 5
          read_timeout = 30

          [CATEGORIES]
          EOF
          cat > ~/.calm/init.ini <<EOF
          [CONFIG]
          location = $HOME/.calm/config.ini

          [DB]
          location = $HOME/.calm/dsl.db

          [LOCAL_DIR]
          location = $HOME/.calm/.local
          EOF
          for f in BP_CRED_NUTANIX_PASSWORD \
                   Profile_Default_variable_PC_PASSWORD \
                   Profile_Default_variable_ADMIN_PASSWORD \
                   Profile_Default_variable_GAME_PROD_PASSWORD \
                   Profile_Default_variable_GAME_OLD_PC_PASSWORD \
                   Profile_Default_variable_GIT_TOKEN; do
            : > ~/.calm/.local/$f
          done
          python3 tooling/blueprint/seed_ci_cache.py

      - name: Generate push_prereq_bps.sh from template + .tgz blobs
        run: |
          python3 - <<'PY'
          import base64, pathlib
          root = pathlib.Path('tooling/blueprint')
          template = (root / 'scripts' / 'push_prereq_bps.sh.template').read_text()
          cp = base64.b64encode((root / 'prereqs' / 'CloneProd.tgz').read_bytes()).decode('ascii')
          bv = base64.b64encode((root / 'prereqs' / 'NewblankVM.tgz').read_bytes()).decode('ascii')
          out = template.replace('__CLONEPROD_TGZ_B64__', cp).replace('__BLANKVM_TGZ_B64__', bv)
          (root / 'scripts' / 'push_prereq_bps.sh').write_text(out)
          PY

      - name: Compile + patch the blueprint
        # Produces tooling/blueprint/blueprint.patched.json — read by
        # the next step's `test_compile_output_shape.py`.
        run: |
          cd tooling/blueprint
          calm compile bp -f blueprint.py --out json > blueprint.json
          python3 patch_escript.py blueprint.json blueprint.patched.json

      - name: Run blueprint pytest (patcher unit + compiled-shape regression)
        # 25 tests covering the 6-pass patcher (unit) + the shape of the
        # patched output (no stub UUIDs in metadata, secrets in canonical
        # no-secret shape, CUSTOM→DEB on service-bearing pkgs, boot disk
        # grown ≥40 GiB, no banned imports in escripts).
        run: pytest tooling/blueprint/tests/ --junit-xml=./junit-blueprint.xml

      - name: Publish test results
        # Surfaces the JUnit reports as a check run + a PR comment +
        # the job summary, so results are visible without digging through
        # the raw logs. `if: always()` so failing tests still get reported
        # (the test steps above already failed the job on a real failure).
        # require_tests=false: if an earlier step (e.g. typecheck) failed
        # before tests ran, just warn on the missing file instead of erroring.
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'junit-*.xml'
          check_name: Test results
          comment: true
          # detailed_summary on, include_passed off: PR comment stays a
          # clean pass/fail tally when green, and expands to list the
          # failing tests (with messages) when something breaks. Full
          # per-test detail is always in the run logs + the check page.
          detailed_summary: true
          require_tests: false
