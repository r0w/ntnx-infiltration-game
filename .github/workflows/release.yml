name: release

# Build the bundled Docker image, push to ghcr.io, compile the Calm
# blueprint, and attach all artifacts to the GitHub release.
#
# Trigger: git tag v* on main, then `git push --tags`. The tag name
# becomes the image tag (vX.Y.Z) plus :latest. Manual run via
# workflow_dispatch is also allowed for re-publishing without a fresh
# tag.
#
# Blueprint compilation: `calm compile bp` normally needs a live PC
# connection (it resolves project / subnet / cluster refs through its
# cache). The compile-blueprint job below pre-seeds ~/.calm/dsl.db
# with stub entries via `seed_ci_cache.py` so calm-dsl resolves to
# placeholder UUIDs. The substrate's editables.yaml marks the relevant
# fields as runtime-overridable, so the operator picks the real subnet/
# cluster at launch time via the Prism Central UI — the stub UUIDs are
# never actually consumed.

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # gh release upload
  packages: write   # ghcr.io push

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo" lowercased — exactly what ghcr expects.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag + image tags
        id: resolve
        # Three trigger paths share this workflow:
        #   - push of a `v*` git tag → cut a real GitHub Release, image
        #     gets `:vX.Y.Z` + `:latest`.
        #   - manual workflow_dispatch with an input tag → same as above
        #     (used to re-release when a previous run flaked).
        #   - push to `develop` → no GH Release, image gets `:develop`
        #     and `:develop-<sha7>` so we can deploy a specific commit
        #     and have it survive future develop pushes.
        # `is_release` is consumed by the upload-blueprint job below so
        # the GH Release path runs only on the first two cases.
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            IS_RELEASE=true
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_RELEASE=true
          else
            TAG="develop"
            IS_RELEASE=false
          fi
          if [[ "${IS_RELEASE}" == "true" ]]; then
            DOCKER_TAGS=$(printf '%s\n%s' "${IMG}:${TAG}" "${IMG}:latest")
          else
            SHA_SHORT="${GITHUB_SHA::7}"
            DOCKER_TAGS=$(printf '%s\n%s' "${IMG}:develop" "${IMG}:develop-${SHA_SHORT}")
          fi
          {
            echo "tag=${TAG}"
            echo "is_release=${IS_RELEASE}"
            echo "docker_tags<<EOF_DT"
            echo "${DOCKER_TAGS}"
            echo "EOF_DT"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=${TAG}, is_release=${IS_RELEASE}"
          echo "Docker tags:"
          echo "${DOCKER_TAGS}"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.resolve.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compile-blueprint:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.build-and-push.outputs.tag }}
      is_release: ${{ needs.build-and-push.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.9 (calm-dsl 4.3.1 needs 3.9)
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install ntnx-ncm-dsl
        run: pip install ntnx-ncm-dsl==4.3.1

      - name: Write ~/.calm config files directly (bypass calm init dsl)
        # `calm init dsl` always probes the PC twice — once for NCM
        # decoupled status (/dm/v3/groups), once for Calm enablement
        # (/api/nutanix/v3/services/nucalm/status). Both refuse in CI
        # since 127.0.0.1 has no PC. The NCM probe falls through to a
        # bad json.loads (we previously sed-patched it), but the Calm
        # status probe raises hard with no fallback. Side-stepping the
        # whole command: write config.ini + init.ini directly, matching
        # the shape `calm init dsl` would produce on success. Stub
        # values are fine — `calm compile bp` only reads the project
        # name + the dsl.db cache (populated next step), neither of
        # which trigger any PC probe.
        run: |
          mkdir -p ~/.calm/.local
          cat > ~/.calm/config.ini <<'EOF'
          [SERVER]
          pc_ip = 127.0.0.1
          pc_port = 9440
          pc_username = admin
          pc_password = stub
          api_key_location = -

          [NCM_SERVER]
          ncm_enabled = False
          host = None
          port = None

          [NC_SERVER]
          enabled = False
          host = None
          username = admin
          password = stub

          [PROJECT]
          name = production

          [LOG]
          level = INFO

          [POLICY]
          policy_status = False

          [APPROVAL_POLICY]
          approval_policy_status = True

          [STRATOS]
          stratos_status = False

          [CLOUD_PROVIDERS]
          cp_status = True

          [CONNECTION]
          retries_enabled = True
          connection_timeout = 5
          read_timeout = 30

          [CATEGORIES]
          EOF
          cat > ~/.calm/init.ini <<EOF
          [CONFIG]
          location = $HOME/.calm/config.ini

          [DB]
          location = $HOME/.calm/dsl.db

          [LOCAL_DIR]
          location = $HOME/.calm/.local
          EOF
          # blueprint.py calls read_local_file() for 6 secret stubs (cred
          # password, 5 profile passwords/tokens). The function looks at
          # .local/<name> first, then ~/.calm/.local/<name>, and errors
          # if neither exists. In CI we don't have the real secrets — and
          # don't need them, the BP is filled at launch via Prism UI. Just
          # create empty placeholders so compile resolves them as "".
          for f in BP_CRED_NUTANIX_PASSWORD \
                   Profile_Default_variable_PC_PASSWORD \
                   Profile_Default_variable_ADMIN_PASSWORD \
                   Profile_Default_variable_GAME_PROD_PASSWORD \
                   Profile_Default_variable_GAME_OLD_PC_PASSWORD \
                   Profile_Default_variable_GIT_TOKEN; do
            : > ~/.calm/.local/$f
          done

      - name: Seed ~/.calm/dsl.db with stub refs (offline compile)
        # seed_ci_cache.py populates the cache with stub UUIDs so
        # compile resolves project/cluster/subnet refs without a live
        # PC. Stubs land in the JSON's substrate.cluster_reference +
        # first NIC subnet_reference; both are marked editable in
        # specs/VM_create_spec_editables.yaml so the operator picks
        # the real entities at launch via Prism UI.
        run: python3 tooling/blueprint/seed_ci_cache.py

      - name: Generate push_prereq_bps.sh from template + .tgz blobs
        # blueprint.py's `Push prereq BPs` install task references
        # scripts/push_prereq_bps.sh — assembled at compile time from
        # the template + base64-inlined CloneProd.tgz + NewblankVM.tgz
        # (per memory project_bundle_inline_b64). The output is gitignored
        # since the blobs change. compile.sh does this locally; replicate
        # it inline here so `calm compile bp` finds the file.
        run: |
          python3 - <<'PY'
          import base64, pathlib
          root = pathlib.Path('tooling/blueprint')
          template = (root / 'scripts' / 'push_prereq_bps.sh.template').read_text()
          cp = base64.b64encode((root / 'prereqs' / 'CloneProd.tgz').read_bytes()).decode('ascii')
          bv = base64.b64encode((root / 'prereqs' / 'NewblankVM.tgz').read_bytes()).decode('ascii')
          out = template.replace('__CLONEPROD_TGZ_B64__', cp).replace('__BLANKVM_TGZ_B64__', bv)
          (root / 'scripts' / 'push_prereq_bps.sh').write_text(out)
          print(f'wrote push_prereq_bps.sh ({len(out)} chars)')
          PY

      - name: Build blueprint.json (calm-dsl native + post-compile patcher)
        # patch_escript.py applies 6 passes: banned-import rewrites
        # (sandbox), CUSTOM→DEB packages (cycle avoidance), boot disk
        # 40 GiB grow, owner_reference + project_reference strip, and
        # canonical secret normalization (UI-import safe).
        run: |
          cd tooling/blueprint
          calm compile bp -f blueprint.py --out json > blueprint.json
          python3 patch_escript.py blueprint.json blueprint.patched.json
          # Sanity check: install runbook must have ≥10 tasks
          python3 -c "
          import json
          bp = json.load(open('blueprint.patched.json'))
          for p in bp['spec']['resources']['package_definition_list']:
              if p['type'] == 'DEB':
                  tasks = p['options']['install_runbook']['task_definition_list']
                  ec = [t for t in tasks if t.get('type') in ('EXEC','SET_VARIABLE')]
                  assert len(ec) >= 10, f'expected ≥10 install tasks, got {len(ec)}'
                  print(f'compile-blueprint: {len(ec)} install tasks OK')
                  break
          "

      - name: Stash blueprint.patched.json for upload job
        uses: actions/upload-artifact@v6
        with:
          name: blueprint-json
          path: tooling/blueprint/blueprint.patched.json
          if-no-files-found: error
          retention-days: 1

  upload-blueprint:
    needs: compile-blueprint
    runs-on: ubuntu-latest
    # Only on real releases (tag push or workflow_dispatch). Develop-push
    # builds skip this job — the docker image + the artifact-stashed
    # blueprint.patched.json are enough for dev deploys via launch.py;
    # we don't want to clutter the GH Releases page with dev tags.
    if: needs.compile-blueprint.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Pull compiled blueprint from previous job
        uses: actions/download-artifact@v7
        with:
          name: blueprint-json
          path: tooling/blueprint/

      - name: Create release if missing + upload blueprint asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compile-blueprint.outputs.tag }}
        run: |
          # Push of a tag does NOT auto-create a GitHub Release; do it here
          # if absent. `gh release view` exits non-zero when the release
          # doesn't exist yet — that's the trigger to create it.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Bound the auto-generated notes to the previous existing tag
            # when it's resolvable. On workflow_dispatch the release tag is
            # often not a git ref yet, so `$TAG^` doesn't resolve — falling
            # back to "$TAG" itself produced a self-referential, nonexistent
            # previous_tag that GitHub rejects (HTTP 400 Invalid previous_tag).
            # When no previous tag resolves, drop the flag entirely and let
            # --generate-notes auto-pick the prior published release.
            PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [[ -n "$PREV_TAG" ]]; then
              gh release create "$TAG" --generate-notes --title "$TAG" \
                --notes-start-tag "$PREV_TAG"
            else
              gh release create "$TAG" --generate-notes --title "$TAG"
            fi
          fi

          # Release assets are renamed at upload time with a `nig-NN-`
          # prefix (NIG = ntnx-infiltration-game) so the GitHub Release
          # page lists them in the order the operator should consume:
          #
          #   nig-00-runbook-prerequisites.json   one-shot per fresh PC,
          #                                        creates the AD endpoint
          #   nig-01-blueprint.json               the game BP — upload, fill
          #                                        vars, launch. Auto-uploads
          #                                        CloneProd + BlankVM-source
          #                                        (bundled inline as base64
          #                                        in push_prereq_bps.sh)
          #                                        + creates production VMs +
          #                                        users + AD endpoint users +
          #                                        starts the container.
          #
          # Two assets, two clicks. Same UX as the legacy
          # ntnx-escape-game (1 runbook + 1 blueprint).
          STAGE=$(mktemp -d)
          [[ -f tooling/runbook_prerequisites.json ]] && \
            cp tooling/runbook_prerequisites.json "$STAGE/nig-00-runbook-prerequisites.json"
          cp tooling/blueprint/blueprint.patched.json "$STAGE/nig-01-blueprint.json"
          ls -la "$STAGE/"
          gh release upload "$TAG" "$STAGE"/* --clobber
